<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Jobs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50">
    <div class="container mx-auto p-8">
        <h1 class="text-3xl font-bold mb-6">All Jobs</h1>
        <table class="min-w-full bg-white">
            <thead>
                <tr>
                    <th class="py-2 px-4 border-b">Title</th>
                    <th class="py-2 px-4 border-b">Qualifications</th>
                    <th class="py-2 px-4 border-b">Description</th>
                    <th class="py-2 px-4 border-b">Domain</th>
                    <th class="py-2 px-4 border-b">PDF</th>
                    <th class="py-2 px-4 border-b">Actions</th>
                </tr>
            </thead>
            <tbody id="jobs-table-body">
                {% for job in jobs %}
                <tr>
                    <td class="py-2 px-4 border-b">{{ job.title }}</td>
                    <td class="py-2 px-4 border-b">{{ job.qualifications }}</td>
                    <td class="py-2 px-4 border-b">{{ job.description }}</td>
                    <td class="py-2 px-4 border-b">{{ job.domain }}</td>
                    <td class="py-2 px-4 border-b"><a href="{{ url_for('view_pdf', filename=job.pdf_path) }}" target="_blank">View PDF</a></td>
                    <td class="py-2 px-4 border-b">
                        <a href="{{ url_for('edit_job', job_id=job.id) }}" class="bg-yellow-500 text-white py-1 px-3 rounded hover:bg-yellow-600">Edit</a>
                        <form action="{{ url_for('delete_job', job_id=job.id) }}" method="POST" style="display:inline;" onsubmit="return confirmDelete(event)">
                            <button type="submit" class="bg-red-500 text-white py-1 px-3 rounded hover:bg-red-600">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <script>
        function confirmDelete(event) {
            if (confirm("Are you sure you want to delete this job?")) {
                event.preventDefault();
                const form = event.target;
                fetch(form.action, {
                    method: form.method,
                    body: new FormData(form)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert("Job deleted successfully!");
                        window.location.reload();
                    } else {
                        alert("Failed to delete job.");
                    }
                })
                .catch(error => console.error('Error deleting job:', error));
            } else {
                event.preventDefault();
                return false;
            }
        }
    </script>
</body>
</html>
