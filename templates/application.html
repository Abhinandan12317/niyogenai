<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Job</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100">
    <div class="flex min-h-screen justify-center items-center">
        <form id="apply-job-form" action="/apply/{{ job_id }}" method="POST" enctype="multipart/form-data" class="bg-white p-8 rounded shadow-md w-full max-w-lg">
            <h1 class="text-2xl font-semibold mb-6">Apply for Job</h1>
            <div class="mb-4">
                <label for="name" class="block text-lg font-medium">Name</label>
                <input type="text" id="name" name="name" class="w-full p-2 border rounded" required>
            </div>
            <div class="mb-4">
                <label for="description" class="block text-lg font-medium">Description</label>
                <textarea id="description" name="description" class="w-full p-2 border rounded" required></textarea>
            </div>
            <div class="mb-4">
                <label for="resume" class="block text-lg font-medium">Resume</label>
                <input type="file" id="resume" name="resume" class="w-full p-2 border rounded" required>
            </div>
            <button type="submit" class="bg-green-700 text-white py-2 px-4 rounded">Submit Application</button>
        </form>
    </div>
</body>
</html>
